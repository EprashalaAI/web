<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panini V11 - The Complete Web Edition</title>
    <style>
        :root {
            --bg-dark: #0000AA;
            --bg-editor: #0000AA;
            --bg-terminal: #000000;
            --toolbar: #E8E8E8;
            --menu-bar: #D3D3D3;
            --text-light: #FFFFFF;
            --accent: #2196F3;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Menu & Toolbar */
        .menu-bar { background: var(--menu-bar); padding: 5px 10px; display: flex; gap: 15px; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; border-bottom: 2px solid #999; flex-wrap: wrap; }
        .menu-item { cursor: pointer; padding: 3px 6px; border-radius: 3px; user-select: none; }
        .menu-item:hover { background: #bbb; }
        .menu-item.primary { background: #4CAF50; color: white; }
        .menu-item.magic { background: #9C27B0; color: white; }
        
        .toolbar { background: var(--toolbar); padding: 8px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; border-bottom: 2px solid #999; }
        .toolbar button { font-weight: bold; padding: 4px 10px; background: #D3D3D3; border: 1px solid #777; cursor: pointer; border-radius: 4px; box-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .toolbar button:active { box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3); }

        /* Workspace (Split View) */
        .workspace { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        @media (min-width: 768px) { .workspace { flex-direction: row; } }
        
        .pane { flex: 1; display: flex; flex-direction: column; border: 1px solid #555; position: relative; }
        .pane-header { background: var(--menu-bar); font-family: 'Courier New', monospace; font-weight: bold; padding: 3px 10px; font-size: 12px; }
        
        /* Advanced Custom Code Editor */
        .editor-container { flex: 1; position: relative; background: var(--bg-editor); overflow: hidden; }
        .editor-textarea, .editor-highlight { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            padding: 10px; font-family: 'Consolas', monospace; font-size: 16px; 
            line-height: 1.5; border: none; outline: none; white-space: pre; 
            overflow: auto; word-wrap: normal;
        }
        .editor-textarea { 
            color: transparent; background: transparent; caret-color: white; z-index: 2; resize: none; 
        }
        .editor-highlight { 
            color: var(--text-light); z-index: 1; pointer-events: none; 
        }
        
        /* Syntax Colors matches Python Tkinter specs */
        .st-comment { color: #888888; }
        .st-action { color: #FFB86C; font-weight: bold; }
        .st-control { color: #F1FA8C; font-weight: bold; }
        .st-destination { color: #8BE9FD; }
        .st-string { color: #50FA7B; }

        /* Terminal */
        .terminal { flex: 1; background: var(--bg-terminal); color: #00FF00; padding: 10px; font-family: 'Consolas', monospace; font-size: 15px; overflow-y: auto; white-space: pre-wrap; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #2B2B2B; color: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 650px; display: flex; flex-direction: column; gap: 10px; }
        .modal-content textarea { width: 100%; height: 150px; background: #1E1E1E; color: white; border: 1px solid #555; padding: 10px; font-family: monospace; }
        .modal-btn-row { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-btn { padding: 8px 15px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .btn-close { background: #f44336; color: white; }
        
        /* Keyboard Drawer */
        .keyboard { display: none; background: #2B2B2B; padding: 10px; flex-wrap: wrap; justify-content: center; gap: 4px; border-top: 2px solid #555; }
        .kb-btn { background: #D3D3D3; border: none; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; min-width: 40px; }
        .kb-btn.kw { background: #4CAF50; color: white; }
    </style>
</head>
<body>

    <!-- Menu Bar -->
    <div class="menu-bar">
        <div class="menu-item primary" onclick="runCode()">▶ Run (Ctrl+Enter)</div>
        <div class="menu-item magic" onclick="openWand()">🪄 Magic Wand</div>
        <div class="menu-item" onclick="toggleKeyboard()">⌨ Keyboard</div>
        <div class="menu-item" onclick="formatEditor()">🧹 Format Code</div>
    </div>

    <!-- Shortcut Toolbar -->
    <div class="toolbar" id="toolbar">
        <button onclick="insertText('वद ')">वद</button>
        <button onclick="insertText('पृच्छ ')">पृच्छ</button>
        <button onclick="insertText('स्थापय ')">स्थापय</button>
        <button onclick="insertText('संयोजय ')">संयोजय (+)</button>
        <button onclick="insertText('न्यूनय ')">न्यूनय (-)</button>
        <button onclick="insertText('गुणय ')">गुणय (*)</button>
        <button onclick="insertText('विभज ')">विभज (/)</button>
        <button onclick="insertText('यदि ')">यदि</button>
        <button onclick="insertText('तर्हि ')">तर्हि</button>
        <button onclick="insertText('यावत् ')">यावत्</button>
        <button onclick="insertText('-मध्ये ')">-मध्ये</button>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <div class="pane">
            <div class="pane-header">MAIN.SAN</div>
            <div class="editor-container">
                <textarea id="code-editor" class="editor-textarea" spellcheck="false" oninput="syncEditor()" onscroll="syncScroll()" onkeyup="handleKeylogger(event)">// PANINI V11 : The Complete Edition

वद "Welcome to Panini Web Ide!"
</textarea>
                <div id="code-highlight" class="editor-highlight"></div>
            </div>
        </div>
        <div class="pane" style="flex: 0.6;">
            <div class="pane-header">MESSAGE / OUTPUT</div>
            <div class="terminal" id="terminal">System Ready...</div>
        </div>
    </div>

    <!-- Keyboard Drawer -->
    <div class="keyboard" id="keyboard"></div>

    <!-- Magic Wand Modal -->
    <div class="modal" id="wandModal">
        <div class="modal-content">
            <h3>🪄 C/C++ to Sanskrit Transpiler</h3>
            <p>Paste School C/C++ Code Here:</p>
            <textarea id="cppCode">#include <iostream>
using namespace std;
int main() {
    int age;
    cout << "Enter your age: ";
    cin >> age;
    if (age > 18) {
        cout << "Adult: " << age;
    }
}</textarea>
            <div class="terminal" id="cppOutput" style="height: 100px; padding: 5px; font-size: 13px;">C++ Compiler Output...</div>
            <div class="modal-btn-row">
                <button class="modal-btn" style="background:#2196F3; color:white;" onclick="compileCPP()">▶ Run C++ (G++)</button>
                <button class="modal-btn" style="background:#9C27B0; color:white;" onclick="transpileCode()">✨ Convert to Panini</button>
                <button class="modal-btn btn-close" onclick="document.getElementById('wandModal').style.display='none'">Close</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. PANINI AST ENGINE & LEXER PORT 
        // ==========================================
        class SanskritEngine {
            constructor() {
                this.specs = [
                    ['COMMENT', /^\/\/.*/],
                    ['STRING', /^"[^"]*"/],
                    ['YADI', /^यदि/],
                    ['TARHI', /^तर्हि/],
                    ['YAVAT', /^यावत्/],
                    ['PRICCHA', /^पृच्छ/],
                    ['STHAPAYA', /^स्थापय/],
                    ['VADA', /^वद/],
                    ['ADD', /^संयोजय/],
                    ['SUB', /^न्यूनय/],
                    ['MUL', /^गुणय/],
                    ['DIV', /^विभज/],
                    ['OP', /^(==|!=|<=|>=|<|>)/],
                    ['LPAREN', /^\(/],
                    ['RPAREN', /^\)/],
                    ['LBRACE', /^\{/],
                    ['RBRACE', /^\}/],
                    ['DESTINATION', /^[a-zA-Z_\u0900-\u097F]+-मध्ये/],
                    ['NUMBER', /^[0-9०-९]+(?:\.[0-9०-९]+)?/],
                    ['ID', /^[a-zA-Z_\u0900-\u097F]+/],
                    ['SKIP', /^[ \t\r]+/],
                    ['NEWLINE', /^\n/],
                    ['DOSHA', /^./]
                ];
                this.outputLog = [];
            }

            tokenize(code) {
                let tokens = [];
                let pos = 0;
                while (pos < code.length) {
                    let match = null;
                    let textSlice = code.slice(pos);
                    
                    for (let [kind, regex] of this.specs) {
                        let m = regex.exec(textSlice);
                        if (m && m.index === 0) {
                            match = { kind, val: m[0] };
                            break;
                        }
                    }
                    if (!match) throw new Error(`व्याकरण दोषः (Syntax Error) near pos ${pos}`);
                    pos += match.val.length;

                    if (match.kind === 'SKIP' || match.kind === 'COMMENT') continue;

                    // Convert Devanagari numerals to standard numbers floats/ints
                    if (match.kind === 'NUMBER') {
                        let eng = match.val.replace(/[०-९]/g, d => '०१२३४५६७८९'.indexOf(d));
                        match.val = eng.includes('.') ? parseFloat(eng) : parseInt(eng, 10);
                    } 
                    if (match.kind === 'STRING') match.val = match.val.slice(1, -1);
                    
                    tokens.push(match);
                }
                return tokens;
            }

            extractBlock(tokens, startIdx, openTok, closeTok) {
                let block = [];
                let depth = 0;
                let i = startIdx;
                while (i < tokens.length && tokens[i].kind !== openTok) i++;
                i++;
                while (i < tokens.length) {
                    if (tokens[i].kind === openTok) depth++;
                    else if (tokens[i].kind === closeTok) {
                        if (depth === 0) return { nextIdx: i + 1, block };
                        depth--;
                    }
                    block.push(tokens[i]);
                    i++;
                }
                throw new Error(`दोषः (Error): Missing closing ${closeTok}`);
            }

            evaluateCondition(tokens, memory) {
                let clean = tokens.filter(t => t.kind !== 'NEWLINE');
                if (clean.length >= 3) {
                    let left = ['NUMBER', 'STRING'].includes(clean[0].kind) ? clean[0].val : (memory[clean[0].val] || 0);
                    let op = clean[1].val;
                    let right = ['NUMBER', 'STRING'].includes(clean[2].kind) ? clean[2].val : (memory[clean[2].val] || 0);

                    if (op === '==') return left == right;
                    if (op === '!=') return left != right;
                    
                    let ln = parseFloat(left), rn = parseFloat(right);
                    if (op === '>') return ln > rn;
                    if (op === '<') return ln < rn;
                    if (op === '>=') return ln >= rn;
                    if (op === '<=') return ln <= rn;
                }
                return false;
            }

            executeKarakaLine(tokens, memory) {
                if (!tokens.length) return;
                
                const getTokens = (kind) => tokens.filter(t => t.kind === kind);
                const has = (kind) => tokens.some(t => t.kind === kind);
                
                let destToken = tokens.find(t => t.kind === 'DESTINATION');
                let vals = tokens.filter(t => ['NUMBER', 'STRING', 'ID'].includes(t.kind) && t.kind !== 'DESTINATION');
                
                let getVal = (v) => ['NUMBER', 'STRING'].includes(v.kind) ? v.val : (memory[v.val] || 0);

                if (has('PRICCHA') && destToken) {
                    let destVar = destToken.val.replace('-मध्ये', '');
                    let userInput = prompt(`Enter value for '${destVar}':`, "0") || "0";
                    let num = parseFloat(userInput);
                    memory[destVar] = isNaN(num) ? userInput : num;
                }
                else if (has('STHAPAYA') && destToken && vals.length > 0) {
                    memory[destToken.val.replace('-मध्ये', '')] = getVal(vals[0]);
                }
                else if (has('ADD') && destToken && vals.length >= 2) {
                    let v1 = getVal(vals[0]), v2 = getVal(vals[1]);
                    memory[destToken.val.replace('-मध्ये', '')] = (typeof v1 === 'string' || typeof v2 === 'string') ? String(v1) + String(v2) : v1 + v2;
                }
                else if (has('SUB') && destToken && vals.length >= 2) {
                    memory[destToken.val.replace('-मध्ये', '')] = Number(getVal(vals[0])) - Number(getVal(vals[1]));
                }
                else if (has('MUL') && destToken && vals.length >= 2) {
                    memory[destToken.val.replace('-मध्ये', '')] = Number(getVal(vals[0])) * Number(getVal(vals[1]));
                }
                else if (has('DIV') && destToken && vals.length >= 2) {
                    let v1 = getVal(vals[0]), v2 = getVal(vals[1]);
                    if (Number(v2) === 0) {
                        memory[destToken.val.replace('-मध्ये', '')] = "Error: Div by 0";
                    } else {
                        // Integer Truncation Division mimicking C++
                        if (Number.isInteger(v1) && Number.isInteger(v2)) {
                            memory[destToken.val.replace('-मध्ये', '')] = Math.trunc(v1 / v2);
                        } else {
                            memory[destToken.val.replace('-मध्ये', '')] = v1 / v2;
                        }
                    }
                }
                else if (has('VADA')) {
                    let parts = vals.map(v => getVal(v));
                    this.outputLog.push(parts.join(""));
                }
            }

            runAst(tokens, memory) {
                let i = 0;
                while (i < tokens.length) {
                    let kind = tokens[i].kind;
                    if (kind === 'NEWLINE') { i++; continue; }

                    if (kind === 'YADI') {
                        let cond = this.extractBlock(tokens, i, 'LPAREN', 'RPAREN');
                        let trueBlock = this.extractBlock(tokens, cond.nextIdx, 'LBRACE', 'RBRACE');
                        let falseBlock = [];
                        let lookahead = trueBlock.nextIdx;
                        
                        while (lookahead < tokens.length && tokens[lookahead].kind === 'NEWLINE') lookahead++;
                        if (lookahead < tokens.length && tokens[lookahead].kind === 'TARHI') {
                            let fb = this.extractBlock(tokens, lookahead + 1, 'LBRACE', 'RBRACE');
                            falseBlock = fb.block;
                            i = fb.nextIdx;
                        } else {
                            i = trueBlock.nextIdx;
                        }

                        if (this.evaluateCondition(cond.block, memory)) this.runAst(trueBlock.block, memory);
                        else if (falseBlock.length) this.runAst(falseBlock, memory);
                        continue;
                    }

                    if (kind === 'YAVAT') {
                        let cond = this.extractBlock(tokens, i, 'LPAREN', 'RPAREN');
                        let loopBlock = this.extractBlock(tokens, cond.nextIdx, 'LBRACE', 'RBRACE');
                        let safety = 0;
                        while (this.evaluateCondition(cond.block, memory) && safety < 2000) {
                            this.runAst(loopBlock.block, memory);
                            safety++;
                        }
                        i = loopBlock.nextIdx;
                        continue;
                    }

                    let lineTokens = [];
                    while (i < tokens.length && !['NEWLINE', 'LBRACE', 'RBRACE'].includes(tokens[i].kind)) {
                        lineTokens.push(tokens[i]);
                        i++;
                    }
                    this.executeKarakaLine(lineTokens, memory);
                }
            }

            execute(code) {
                this.outputLog = [];
                try {
                    let tokens = this.tokenize(code);
                    let memory = {};
                    this.runAst(tokens, memory);
                    return this.outputLog.length ? this.outputLog.join('\n') : "Program finished with no output.";
                } catch (e) {
                    return `Execution Error: ${e.message}`;
                }
            }
        }
        
        const engine = new SanskritEngine();

        // ==========================================
        // 2. IDE UI LOGIC & SYNTAX HIGHLIGHTING
        // ==========================================
        const editor = document.getElementById('code-editor');
        const highlight = document.getElementById('code-highlight');
        const term = document.getElementById('terminal');

        function syncEditor() {
            let text = editor.value;
            // Apply Regex Highlights
            text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // Highlight rules based strictly on Python's RetroIDE tagging
            text = text.replace(/(\/\/.*)/g, '<span class="st-comment">$1</span>');
            text = text.replace(/("[^"]*")/g, '<span class="st-string">$1</span>');
            text = text.replace(/\b(स्थापय|वद|संयोजय|न्यूनय|गुणय|विभज|पृच्छ)\b/g, '<span class="st-action">$1</span>');
            text = text.replace(/\b(यदि|तर्हि|यावत्)\b/g, '<span class="st-control">$1</span>');
            text = text.replace(/([a-zA-Z_\u0900-\u097F]+-मध्ये)/g, '<span class="st-destination">$1</span>');
            
            highlight.innerHTML = text + "<br>"; // Fix last line scrolling
        }

        function syncScroll() {
            highlight.scrollTop = editor.scrollTop;
            highlight.scrollLeft = editor.scrollLeft;
        }

        function runCode() {
            term.innerText = "Executing...\n";
            setTimeout(() => { term.innerText = engine.execute(editor.value); }, 50);
        }

        // ==========================================
        // 3. AUTO-CORRECT KEYLOGGER 
        // ==========================================
        const translations = {
            'if': 'यदि', 'else': 'तर्हि', 'while': 'यावत्',
            'print': 'वद', 'printf': 'वद', 'cout': 'वद',
            'store': 'स्थापय', 
            'add': 'संयोजय', 'plus': 'संयोजय',
            'sub': 'न्यूनय', 'minus': 'न्यूनय',
            'mul': 'गुणय', 'multiply': 'गुणय',
            'div': 'विभज', 'divide': 'विभज',
            'ask': 'पृच्छ', 'scan': 'पृच्छ', 'scanf': 'पृच्छ', 'cin': 'पृच्छ'
        };

        function handleKeylogger(e) {
            if ([' ', 'Enter', '(', '{'].includes(e.key)) {
                let val = editor.value;
                let caret = editor.selectionStart;
                let before = val.substring(0, caret - 1);
                
                // Find last English word typed
                let match = before.match(/\b([a-zA-Z]+)$/);
                if (match) {
                    let word = match[1].toLowerCase();
                    if (translations[word]) {
                        let sans = translations[word];
                        editor.value = before.substring(0, match.index) + sans + val.substring(caret - 1);
                        editor.selectionStart = editor.selectionEnd = match.index + sans.length + 1;
                    }
                }
            }
            syncEditor();
        }

        function insertText(text) {
            let start = editor.selectionStart;
            editor.value = editor.value.substring(0, start) + text + editor.value.substring(editor.selectionEnd);
            editor.selectionStart = editor.selectionEnd = start + text.length;
            editor.focus();
            syncEditor();
        }

        // ==========================================
        // 4. DEVANAGARI KEYBOARD
        // ==========================================
        const chars = [
            'अ','आ','इ','ई','उ','ऊ','ऋ','ए','ऐ','ओ','औ',
            'क','ख','ग','घ','ङ','च','छ','ज','झ','ञ',
            'ट','ठ','ड','ढ','ण','त','थ','द','ध','न',
            'प','फ','ब','भ','म','य','र','ल','व','श',
            'ष','स','ह','क्ष','त्र','ज्ञ','श्र',
            'ा','ि','ी','ु','ू','ृ','े','ै','ो','ौ','ं','ः','्',
            '०','१','२','३','४','५','६','७','८','९',
            'यदि','तर्हि','यावत्','वद','पृच्छ','स्थापय','संयोजय','न्यूनय','गुणय','विभज','-मध्ये'
        ];
        const kbDraw = document.getElementById('keyboard');
        chars.forEach(c => {
            let btn = document.createElement('button');
            btn.className = 'kb-btn ' + (c.length > 1 ? 'kw' : '');
            btn.innerText = c;
            btn.onclick = () => insertText(c);
            kbDraw.appendChild(btn);
        });

        function toggleKeyboard() {
            kbDraw.style.display = kbDraw.style.display === 'flex' ? 'none' : 'flex';
        }

        // ==========================================
        // 5. C/C++ MAGIC WAND TRANSPILER
        // ==========================================
        function openWand() { document.getElementById('wandModal').style.display = 'flex'; }
        
        async function compileCPP() {
            const code = document.getElementById('cppCode').value;
            const out = document.getElementById('cppOutput');
            out.innerText = "Connecting to Public Compiler API (Piston)...\nCompiling...";
            try {
                const res = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: "c++", version: "10.2.0", files: [{ content: code }] })
                });
                const data = await res.json();
                out.innerText = data.run.output || data.compile.output || "Error compiling.";
            } catch (e) {
                out.innerText = "Network Error: Could not reach compiler API.";
            }
        }

        function transpileCode() {
            let code = document.getElementById('cppCode').value;
            
            // Clean boilerplates
            code = code.replace(/#include\s*<.*?>\n?/g, '');
            code = code.replace(/using\s+namespace\s+std\s*;\n?/g, '');
            code = code.replace(/(int|void)\s+main\s*\(\)\s*\{/g, '');
            code = code.replace(/return\s+0\s*;/g, '');
            let lastBrace = code.lastIndexOf('}');
            if (lastBrace !== -1) code = code.substring(0, lastBrace) + code.substring(lastBrace + 1);

            let lines = code.split('\n');
            let outLines = [];

            for (let line of lines) {
                if (!line.trim()) continue;
                
                // Basic IO
                line = line.replace(/cout\s*<<\s*(.*?);/g, (m, p1) => 'वद ' + p1.replace(/<</g, ' ').replace(/endl/g, '').trim());
                line = line.replace(/cin\s*>>\s*([a-zA-Z0-9_]+)\s*;/g, 'पृच्छ $1-मध्ये');
                line = line.replace(/printf\s*\(\s*"([^"]*?)(?:%[a-zA-Z])([^"]*?)"\s*,\s*([a-zA-Z0-9_]+)\s*\)\s*;/g, 'वद "$1" $3 "$2"');
                line = line.replace(/printf\s*\(\s*"([^"]*)"\s*\)\s*;/g, 'वद "$1"');
                line = line.replace(/scanf\s*\(\s*"[^"]*"\s*,\s*&?([a-zA-Z0-9_]+)\s*\)\s*;/g, 'पृच्छ $1-मध्ये');

                // Flow Control
                line = line.replace(/if\s*\((.*?)\)/g, 'यदि ( $1 )');
                line = line.replace(/else/g, 'तर्हि');
                line = line.replace(/while\s*\((.*?)\)/g, 'यावत् ( $1 )');

                // Advanced Math mappings
                if (line.includes('*') && line.includes('=')) {
                    line = line.replace(/(?:int\s+|float\s+|double\s+)?([a-zA-Z_]\w*)\s*=\s*([a-zA-Z0-9_.]+)\s*\*\s*([a-zA-Z0-9_.]+)\s*;?/g, '$2 $3 गुणय $1-मध्ये');
                } else if (line.includes('/') && line.includes('=')) {
                    line = line.replace(/(?:int\s+|float\s+|double\s+)?([a-zA-Z_]\w*)\s*=\s*([a-zA-Z0-9_.]+)\s*\/\s*([a-zA-Z0-9_.]+)\s*;?/g, '$2 $3 विभज $1-मध्ये');
                } else if (line.includes('+') && line.includes('=')) {
                    line = line.replace(/(?:int\s+|char\s+\*?\s*|float\s+|string\s+)?([a-zA-Z_]\w*)\s*=\s*([a-zA-Z0-9_".]+)\s*\+\s*([a-zA-Z0-9_".]+)\s*;?/g, '$2 $3 संयोजय $1-मध्ये');
                } else if (line.includes('-') && line.includes('=')) {
                    line = line.replace(/(?:int\s+|float\s+|double\s+)?([a-zA-Z_]\w*)\s*=\s*([a-zA-Z0-9_.]+)\s*-\s*([a-zA-Z0-9_.]+)\s*;?/g, '$2 $3 न्यूनय $1-मध्ये');
                } else if (line.includes('=') && !line.includes('==')) {
                    // Standard Assign
                    let matches = [...line.matchAll(/([a-zA-Z_]\w*)\s*=\s*("[^"]*"|[a-zA-Z0-9_.]+)/g)];
                    if (matches.length > 0) {
                        line = matches.map(m => `${m[2]} ${m[1]}-मध्ये स्थापय`).join('\n');
                    }
                } else if (line.match(/(int|float|double|string)\s+([a-zA-Z_]\w*)\s*;/)) {
                    // Init zero
                    let matches = [...line.matchAll(/([a-zA-Z_]\w*)/g)].map(m => m[0]).filter(v => !['int','float','double','string'].includes(v));
                    line = matches.map(v => `० ${v}-मध्ये स्थापय`).join('\n');
                }
                outLines.push(line);
            }
            
            document.getElementById('wandModal').style.display = 'none';
            editor.value = outLines.join('\n').trim();
            syncEditor();
        }

        // Init Editor Highlighting
        syncEditor();

        // Keyboard Shortcut setup
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
        });
    </script>
</body>
